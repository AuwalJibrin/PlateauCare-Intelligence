<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFac" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2744" />
      <stop offset="100%" stop-color="#071224" />
    </linearGradient>
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgFac)" />
  
  <!-- Facility Building Structure -->
  <rect x="220" y="240" width="360" height="260" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2" />
  <rect x="320" y="160" width="160" height="80" rx="8" fill="#0F172A" stroke="#334155" stroke-width="2" />
  
  <!-- Medical Cross Symbol -->
  <rect x="388" y="180" width="24" height="40" rx="4" fill="#14B8A6" />
  <rect x="380" y="188" width="40" height="24" rx="4" fill="#14B8A6" />

  <!-- Windows Grid -->
  <rect x="250" y="280" width="40" height="40" rx="4" fill="#38BDF8" fill-opacity="0.3" />
  <rect x="310" y="280" width="40" height="40" rx="4" fill="#38BDF8" fill-opacity="0.3" />
  <rect x="450" y="280" width="40" height="40" rx="4" fill="#38BDF8" fill-opacity="0.3" />
  <rect x="510" y="280" width="40" height="40" rx="4" fill="#38BDF8" fill-opacity="0.3" />

  <rect x="250" y="340" width="40" height="40" rx="4" fill="#38BDF8" fill-opacity="0.3" />
  <rect x="310" y="340" width="40" height="40" rx="4" fill="#38BDF8" fill-opacity="0.3" />
  <rect x="450" y="340" width="40" height="40" rx="4" fill="#38BDF8" fill-opacity="0.3" />
  <rect x="510" y="340" width="40" height="40" rx="4" fill="#38BDF8" fill-opacity="0.3" />

  <!-- Main Entrance -->
  <rect x="365" y="400" width="70" height="100" rx="6" fill="#0F766E" />
  <line x1="400" y1="400" x2="400" y2="500" stroke="#14B8A6" stroke-width="2" />

  <!-- Pulse Rings -->
  <circle cx="400" cy="200" r="70" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 4" />
</svg>

