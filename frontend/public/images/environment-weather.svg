<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEnv" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071224" />
      <stop offset="100%" stop-color="#0F2744" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgEnv)" />
  
  <!-- Atmospheric Cloud Layer -->
  <path d="M 280 280 A 50 50 0 0 1 360 230 A 70 70 0 0 1 480 240 A 55 55 0 0 1 540 290 A 45 45 0 0 1 510 360 L 290 360 A 40 40 0 0 1 280 280 Z" fill="#1E293B" stroke="#334155" stroke-width="2" />

  <!-- Rain Drops & Environmental Vectors -->
  <g stroke="#38BDF8" stroke-width="3" stroke-linecap="round">
    <line x1="310" y1="390" x2="295" y2="430" />
    <line x1="360" y1="390" x2="345" y2="430" />
    <line x1="410" y1="390" x2="395" y2="430" />
    <line x1="460" y1="390" x2="445" y2="430" />
    <line x1="500" y1="390" x2="485" y2="430" />

    <line x1="330" y1="440" x2="315" y2="480" stroke-opacity="0.6" />
    <line x1="380" y1="440" x2="365" y2="480" stroke-opacity="0.6" />
    <line x1="430" y1="440" x2="415" y2="480" stroke-opacity="0.6" />
    <line x1="480" y1="440" x2="465" y2="480" stroke-opacity="0.6" />
  </g>

  <!-- Ambient Sensor Monitor Ring -->
  <circle cx="400" cy="300" r="160" fill="none" stroke="#14B8A6" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 6" />
</svg>

