<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071224" />
      <stop offset="60%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#0D3B5E" />
    </linearGradient>
    <linearGradient id="mountain1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D4761" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#082A3A" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="mountain2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A3648" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#061A24" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="mountain3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F5A73" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#07202B" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="70%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0D9488" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0A192F" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#14B8A6" stroke-width="0.5" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Sky -->
  <rect width="100%" height="100%" fill="url(#skyGrad)" />
  <rect width="100%" height="100%" fill="url(#sunGlow)" />
  <rect width="100%" height="100%" fill="url(#gridPattern)" />

  <!-- Shere Hills & Plateau Range Distant Silhouette -->
  <path d="M 0 520 Q 240 380 480 470 T 960 420 Q 1200 360 1440 440 T 1600 480 L 1600 900 L 0 900 Z" fill="url(#mountain3)" />

  <!-- Middle Ridge Range -->
  <path d="M 0 590 Q 200 490 520 540 T 1050 490 Q 1320 440 1600 520 L 1600 900 L 0 900 Z" fill="url(#mountain1)" />

  <!-- Foreground Plateau Landscape Silhouette -->
  <path d="M 0 680 Q 300 580 620 620 T 1180 570 Q 1400 550 1600 600 L 1600 900 L 0 900 Z" fill="url(#mountain2)" />

  <!-- Technological Pulse Line across the Hills (Early Warning Grid) -->
  <path d="M 0 680 Q 300 580 620 620 T 1180 570 Q 1400 550 1600 600" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="8 6" />

  <!-- Subtle Beacon Dots on Ridge Peaks -->
  <circle cx="480" cy="470" r="4" fill="#2DD4BF" />
  <circle cx="480" cy="470" r="10" fill="#2DD4BF" fill-opacity="0.2" />
  <circle cx="960" cy="420" r="4" fill="#2DD4BF" />
  <circle cx="960" cy="420" r="12" fill="#2DD4BF" fill-opacity="0.2" />
  <circle cx="1180" cy="570" r="5" fill="#14B8A6" />
  <circle cx="1180" cy="570" r="14" fill="#14B8A6" fill-opacity="0.25" />
</svg>

